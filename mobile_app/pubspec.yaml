name: sgau_mobile
description: Système de Gestion des Absences Universitaires - Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  equatable: ^2.0.5

  # Supabase
  supabase_flutter: ^2.7.0

  # Local preferences
  shared_preferences: ^2.2.3

  # GPS & QR
  geolocator: ^13.0.2
  mobile_scanner: ^6.0.1

  # UI
  shimmer: ^3.0.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/